<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Virtual</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            /* Fundo Fallback caso bg.jpg falhe */
            background-color: #1a1a1a;
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: filter 1s ease;
        }
        
        .night-mode { filter: brightness(0.3) contrast(1.2) saturate(0.5); }

        .cookie-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            transition: transform 0.1s;
            background-color: #444; /* Cor caso btn.jpg suma */
        }
        .cookie-btn:active { transform: scale(0.8); }

        .jump-anim { animation: jump 0.5s ease-in-out infinite; }
        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        /* Botão Secreto Invisível */
        #secret-trigger {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="p-4 flex justify-end z-20">
        <div id="relogio" class="badge badge-secondary p-4 shadow-lg font-mono">Hora: 0h</div>
    </div>

    <main class="flex-grow flex flex-col items-center justify-center relative">
        <img id="pet" src="normal.jpg" 
             onerror="this.style.border='5px solid red'; console.error('ERRO: Não encontrei normal.jpg')"
             class="w-72 h-auto drop-shadow-[0_10px_50px_rgba(0,0,0,0.5)]" alt="Pet">

        <div class="mt-12 flex flex-col items-center gap-3">
            <img src="btn.jpg" 
                 onerror="this.style.background='red'; console.error('ERRO: Não encontrei btn.jpg')"
                 class="cookie-btn shadow-2xl" onclick="comandoComer()">
            <span class="text-white text-[10px] font-black tracking-widest bg-black/50 px-3 py-1 rounded-full">ALIMENTAR</span>
        </div>
    </main>

    <div id="secret-trigger" onclick="document.getElementById('modal_secreto').showModal()"></div>

    <dialog id="modal_secreto" class="modal">
      <div class="modal-box bg-slate-900 border-2 border-secondary">
        <h3 class="font-bold text-xl text-secondary mb-4">Galeria Secreta</h3>
        <div class="grid grid-cols-2 gap-4">
            <img src="foto1.jpg" onerror="this.src='https://via.placeholder.com/150?text=Sem+Foto1'" class="rounded-lg">
            <img src="foto2.jpg" onerror="this.src='https://via.placeholder.com/150?text=Sem+Foto2'" class="rounded-lg">
        </div>
        <div class="modal-action">
          <form method="dialog"><button class="btn btn-secondary">Fechar</button></form>
        </div>
      </div>
    </dialog>

    <script>
        const pet = document.getElementById('pet');
        const relogio = document.getElementById('relogio');

        let horas = 0;
        let bloqueado = false;

        // Função para garantir que os arquivos existem
        function comandoComer() {
            if (bloqueado) return;
            bloqueado = true;

            pet.src = "comendo.jpg";

            setTimeout(() => {
                pet.src = "feliz.jpg";
                pet.classList.add('jump-anim');

                setTimeout(() => {
                    pet.src = "normal.jpg";
                    pet.classList.remove('jump-anim');
                    bloqueado = false;
                }, 2000);
            }, 700);
        }

        // Sistema de tempo
        setInterval(() => {
            horas++;
            if (horas >= 24) horas = 0;
            relogio.innerText = `Hora: ${horas}h`;

            if (horas >= 18 || horas <= 5) {
                document.body.classList.add('night-mode');
            } else {
                document.body.classList.remove('night-mode');
            }
        }, 1000);

        // Alerta de depuração: avisa se o arquivo não está na mesma pasta
        if (window.location.protocol === 'file:') {
            console.log("DICA: Certifique-se de que o arquivo HTML e as imagens estão na MESMA pasta.");
        }
    </script>
</body>
</html>
